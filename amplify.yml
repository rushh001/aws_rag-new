version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Building static HTML site - no build required"
  artifacts:
    baseDirectory: /
    files:
      - 'index.html'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.ico'
